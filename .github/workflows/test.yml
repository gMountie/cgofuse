name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    runs-on: ${{ matrix.os }}
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: ${{ matrix.cgo }}
      CPATH: ${{ matrix.cpath }}
      GOEXPERIMENT: cgocheck2
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: amd64
            exe: .exe
            cgo: 1
            cpath: C:\Program Files (x86)\WinFsp\inc\fuse
          - os: windows-latest
            arch: amd64
            exe: .exe
            cgo: 0
          # Windows 386 (32-bit) is not a supported target for this fork.
          - os: ubuntu-latest
            arch: amd64
            cgo: 1
          # macOS runner can no longer load the macfuse kext; use runner only to build
          - os: macos-latest
            arch: amd64
            cgo: 1
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Install winfsp and winfsp-tests (Windows)
        if: runner.os == 'Windows'
        run: |
          $headers = @{
              Authorization = "token ${{ secrets.GITHUB_TOKEN }}"
          }
          $releases = Invoke-WebRequest https://api.github.com/repos/winfsp/winfsp/releases -Headers $headers | `
              ConvertFrom-Json

          $asseturi = $releases[0].assets.browser_download_url | `
              Where-Object { $_ -match "winfsp-.*\.msi" }
          Invoke-WebRequest -Uri $asseturi -Out winfsp.msi
          Start-Process -NoNewWindow -Wait msiexec "/i winfsp.msi /qn INSTALLLEVEL=1000"

          $asseturi = $releases[0].assets.browser_download_url | `
              Where-Object { $_ -match "winfsp-tests-.*\.zip" }
          Invoke-WebRequest -Uri $asseturi -Out winfsp-tests.zip
          Expand-Archive -Path winfsp-tests.zip
          Copy-Item "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll" winfsp-tests

      - name: Install FUSE and secfs.test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq install libfuse-dev libfuse3-dev libacl1-dev

          git clone -q https://github.com/billziss-gh/secfs.test.git secfs.test
          git -C secfs.test checkout -q edf5eb4a108bfb41073f765aef0cdd32bb3ee1ed
          mkdir -p secfs.test/tools/bin
          touch secfs.test/tools/bin/bonnie++
          touch secfs.test/tools/bin/iozone
          make -C secfs.test

          # configure fstest for cgofuse
          sed -e 's/^fs=.*$/fs="cgofuse"/' -i""  secfs.test/fstest/fstest/tests/conf

          # remove irrelevant tests
          rm -rf secfs.test/fstest/fstest/tests/xacl
          rm -rf secfs.test/fstest/fstest/tests/zzz_ResourceFork

      - name: Install FUSE and secfs.test (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install macfuse

          git clone -q https://github.com/billziss-gh/secfs.test.git secfs.test
          git -C secfs.test checkout -q edf5eb4a108bfb41073f765aef0cdd32bb3ee1ed
          mkdir -p secfs.test/tools/bin
          touch secfs.test/tools/bin/bonnie++
          touch secfs.test/tools/bin/iozone
          make -C secfs.test

          # configure fstest for cgofuse
          sed -e 's/^fs=.*$/fs="cgofuse"/' -i ""  secfs.test/fstest/fstest/tests/conf

          # monkey-patch/disable some tests for macOS
          rm secfs.test/fstest/fstest/tests/rmdir/12.t
          sed -e 's/lchmod)/lchmod) return 1/' -i "" secfs.test/fstest/fstest/tests/misc.sh

          # remove irrelevant tests
          rm -rf secfs.test/fstest/fstest/tests/xacl
          rm -rf secfs.test/fstest/fstest/tests/zzz_ResourceFork

      - name: Lint and vet (Linux)
        if: runner.os == 'Linux'
        run: |
          go vet ./fuse
          test -z "$(gofmt -l fuse/)"

      - name: Race-enabled unit tests (Linux)
        if: runner.os == 'Linux'
        run: |
          go test -race -count=1 ./fuse
          go test -race -tags=fuse2 -count=1 ./fuse

      - name: Build packages (default; FUSE3 on Linux/FreeBSD, FUSE2 on Windows/macOS)
        run: |
          go build -v -o . ./...
          go build -tags=memfs3 -v -o memfs3${{ matrix.exe }} ./examples/memfs

      - name: Test file systems with FUSE2 (Windows)
        if: runner.os == 'Windows'
        run: |
          Set-PSDebug -Trace 1

          go test -v -count=1 ./fuse

          $testexe = (Get-Item winfsp-tests\winfsp-tests-x64.exe)

          Start-Process -NoNewWindow .\memfs.exe "-o uid=-1,rellinks,FileInfoTimeout=-1 X:"
          Start-Sleep 3
          Push-Location X:\
          . $testexe --fuse-external --resilient --case-insensitive-cmp `
              +* `
              -create_fileattr_test `
              -reparse_nfs_test `
              -ea*
          Stop-Process -Name memfs
          Start-Sleep 3
          Pop-Location

          Start-Process -NoNewWindow .\memfs3.exe "-o uid=-1,rellinks,FileInfoTimeout=-1 X:"
          Start-Sleep 3
          Push-Location X:\
          . $testexe --fuse-external --resilient --case-insensitive-cmp `
              +* `
              -create_fileattr_test `
              -reparse_nfs_test `
              -ea*
          Stop-Process -Name memfs3
          Start-Sleep 3
          Pop-Location

      - name: Test file systems (Linux, default = FUSE3)
        if: runner.os == 'Linux' || (false && runner.os == 'macOS')
        run: |
          set -x

          go test -v -count=1 ./fuse

          mkdir p mnt

          sudo ./memfs -o allow_other,default_permissions,attr_timeout=0 mnt &
          sleep 3
          (cd mnt && sudo prove -fr ../secfs.test/fstest/fstest/tests)
          (cd mnt && ../secfs.test/tools/bin/fsx -N 10000 test xxxxxx)
          (cd mnt && ../secfs.test/tools/bin/fsx -e -N 1000 test xxxx)
          sudo umount mnt

          sudo ./memfs3 -o allow_other,default_permissions,attr_timeout=0 mnt &
          sleep 3
          (cd mnt && sudo prove -fr ../secfs.test/fstest/fstest/tests)
          (cd mnt && ../secfs.test/tools/bin/fsx -N 10000 test xxxxxx)
          (cd mnt && ../secfs.test/tools/bin/fsx -e -N 1000 test xxxx)
          sudo umount mnt

          sudo ./passthrough -o allow_other,default_permissions,attr_timeout=0 p mnt &
          sleep 3
          (cd mnt && sudo prove -fr ../secfs.test/fstest/fstest/tests)
          (cd mnt && ../secfs.test/tools/bin/fsx -N 10000 test xxxxxx)
          sudo umount mnt

          rm -rf p
          rmdir mnt

      - name: Build packages with FUSE2 (Linux)
        if: runner.os == 'Linux'
        run: |
          go build -tags=fuse2 -v -o . ./...
          go build -tags=fuse2,memfs3 -v -o memfs3${{ matrix.exe }} ./examples/memfs

      - name: Test file systems with FUSE2 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -x

          go test -tags=fuse2 -v -count=1 ./fuse

          mkdir p mnt

          sudo ./memfs -o allow_other,default_permissions,attr_timeout=0 mnt &
          sleep 3
          (cd mnt && sudo prove -fr ../secfs.test/fstest/fstest/tests)
          (cd mnt && ../secfs.test/tools/bin/fsx -N 10000 test xxxxxx)
          (cd mnt && ../secfs.test/tools/bin/fsx -e -N 1000 test xxxx)
          sudo umount mnt

          sudo ./memfs3 -o allow_other,default_permissions,attr_timeout=0 mnt &
          sleep 3
          (cd mnt && sudo prove -fr ../secfs.test/fstest/fstest/tests)
          (cd mnt && ../secfs.test/tools/bin/fsx -N 10000 test xxxxxx)
          (cd mnt && ../secfs.test/tools/bin/fsx -e -N 1000 test xxxx)
          sudo umount mnt

          sudo ./passthrough -o allow_other,default_permissions,attr_timeout=0 p mnt &
          sleep 3
          (cd mnt && sudo prove -fr ../secfs.test/fstest/fstest/tests)
          (cd mnt && ../secfs.test/tools/bin/fsx -N 10000 test xxxxxx)
          sudo umount mnt

          rm -rf p
          rmdir mnt

  # macFUSE cannot load its kext in CI and its FUSE3 is a darwin dialect, so
  # macOS FUSE3 is tested via FUSE-T: kext-less (mounts in CI) and its libfuse3
  # fork is upstream-API-compatible.
  macos-fuse-t:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Install FUSE-T
        run: brew install --cask fuse-t

      - name: Build FUSE3 via FUSE-T + non-mount tests
        run: |
          go build -tags=fuse3 -v -o . ./...
          go build -tags=fuse3,memfs3 -v -o memfs3 ./examples/memfs
          go vet -tags=fuse3 ./fuse
          # Confirms cgofuse FUSE3 compiles and links against FUSE-T's upstream
          # libfuse3. Run the pure-Go tests; the FUSE-T *mount* path (TestUnmount/
          # TestSignal) currently SIGSEGVs and needs debugging on real macOS, so
          # it is excluded here. TODO: enable the mount tests once that is fixed.
          go test -tags=fuse3 -run 'TestHandle|TestRecoverAsErrno|TestErrorString|TestOptParse' -v -count=1 ./fuse
